name: Deploy to Netlify

on:
  push:
    branches:
      - claude/iron-dome-defense-game-PwwSZ
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: iron-dome-game/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: iron-dome-game

      - name: Build
        run: npm run build
        working-directory: iron-dome-game

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Create Netlify site and deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          set -e

          echo "=== Checking auth ==="
          netlify status

          echo "=== Creating site ==="
          SITE_NAME="iron-dome-$(date +%s)"
          SITE_JSON=$(netlify sites:create --name "$SITE_NAME" --json)
          echo "Site JSON: $SITE_JSON"

          SITE_ID=$(echo "$SITE_JSON" | jq -r '.id')
          SITE_URL=$(echo "$SITE_JSON" | jq -r '.ssl_url // .url')
          echo "Site ID: $SITE_ID"
          echo "Site URL: $SITE_URL"

          echo "=== Deploying ==="
          netlify deploy \
            --dir=iron-dome-game/dist \
            --site="$SITE_ID" \
            --prod \
            --message="Iron Dome Game"

          echo ""
          echo "=============================="
          echo "LIVE URL: $SITE_URL"
          echo "=============================="
