name: Deploy to Netlify

on:
  push:
    branches:
      - claude/iron-dome-defense-game-PwwSZ

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: iron-dome-game/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: iron-dome-game

      - name: Build
        run: npm run build
        working-directory: iron-dome-game

      - name: Deploy to Netlify
        run: |
          npm install -g netlify-cli
          # Create site if no site ID is stored, else reuse existing
          if [ -z "$NETLIFY_SITE_ID" ]; then
            SITE_JSON=$(netlify sites:create --name "iron-dome-game-${{ github.repository_owner }}" --json 2>/dev/null || \
                        netlify sites:create --name "iron-dome-${{ github.run_id }}" --json)
            SITE_ID=$(echo "$SITE_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          else
            SITE_ID=$NETLIFY_SITE_ID
          fi
          netlify deploy --dir=iron-dome-game/dist --site=$SITE_ID --prod --json | \
            python3 -c "import json,sys; d=json.load(sys.stdin); print('::notice title=Live URL::' + d.get('deploy_url', d.get('url','')))"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
