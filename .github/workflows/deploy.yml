name: Deploy to Netlify

on:
  push:
    branches:
      - claude/iron-dome-defense-game-PwwSZ
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: iron-dome-game/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: iron-dome-game

      - name: Build
        run: npm run build
        working-directory: iron-dome-game

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          set -e

          # Check token
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "ERROR: NETLIFY_AUTH_TOKEN secret is not set!"
            echo "Go to: Settings -> Secrets -> Actions -> New repository secret"
            echo "Name: NETLIFY_AUTH_TOKEN"
            exit 1
          fi
          echo "Token is set (first 4 chars): ${NETLIFY_AUTH_TOKEN:0:4}..."

          # Get account slug
          echo "--- Fetching accounts ---"
          ACCOUNTS=$(netlify api listAccountsForUser)
          echo "Accounts: $ACCOUNTS"
          SLUG=$(echo "$ACCOUNTS" | jq -r '.[0].slug')
          echo "Using account slug: $SLUG"

          # Create site
          echo "--- Creating site ---"
          SITE_NAME="iron-dome-$(date +%s)"
          SITE=$(netlify sites:create \
            --name "$SITE_NAME" \
            --account-slug "$SLUG" \
            --json)
          echo "Site response: $SITE"
          SITE_ID=$(echo "$SITE" | jq -r '.id')
          SITE_URL=$(echo "$SITE" | jq -r '.ssl_url // .url')
          echo "Site ID: $SITE_ID"
          echo "Site URL: $SITE_URL"

          # Deploy
          echo "--- Deploying ---"
          netlify deploy \
            --dir=iron-dome-game/dist \
            --site="$SITE_ID" \
            --prod

          echo ""
          echo "=========================================="
          echo "LIVE: $SITE_URL"
          echo "=========================================="
