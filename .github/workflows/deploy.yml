name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/iron-dome-defense-game-PwwSZ

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: iron-dome-game/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: iron-dome-game

      - name: Build
        run: npm run build
        working-directory: iron-dome-game

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: iron-dome-game/dist
          force_orphan: true
